allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Raise compileSdk + align JVM targets for plugin modules.
// - Some plugins hardcode outdated values (e.g. flutter_secure_storage pins
//   compileSdk 33, while its androidx deps require >= 34).
// - Kotlin Gradle Plugin 2.x rejects Java/Kotlin JVM target mismatches as hard
//   errors (e.g. file_picker has Kotlin jvmTarget 1.8 while Java defaults to 11).
// Must be registered before evaluationDependsOn(":app") triggers early evaluation.
subprojects { sub ->
    sub.afterEvaluate {
        def androidExt = sub.extensions.findByName("android")
        if (androidExt != null) {
            if (androidExt.compileSdk instanceof Integer && androidExt.compileSdk < 36) {
                androidExt.compileSdk = 36
            }
            androidExt.compileOptions {
                sourceCompatibility = JavaVersion.VERSION_17
                targetCompatibility = JavaVersion.VERSION_17
            }
        }
    }
}

// Keep Kotlin JVM targets consistent with the Java target set above.
subprojects { sub ->
    sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_17.toString()
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
