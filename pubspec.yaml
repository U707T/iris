name: iris
description: A lightweight video player
publish_to: none
version: 2.0.1+15

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_localizations:
    sdk: flutter
  intl: any
  file_picker: ^13.1.0
  flutter_breadcrumb: ^1.0.1
  flutter_hooks: ^0.21.3+1
  flutter_secure_storage: ^11.2.0
  flutter_zustand: ^0.0.5
  material_ui: ^1.4.0
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  provider: ^6.1.5
  webdav_client: ^1.2.2
  window_manager: ^0.5.2
  url_launcher: ^6.3.2
  scrollable_positioned_list: ^0.3.8
  google_fonts: ^8.2.1
  dynamic_color: ^2.1.0
  window_size: ^0.2.0
  uuid: ^4.6.0
  image: ^4.10.1
  flutter_markdown: ^0.7.7+1
  http: ^1.6.0
  collection: ^1.19.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  disks_desktop: ^1.0.1
  android_x_storage: ^1.0.2
  permission_handler: ^13.0.2
  desktop_drop: ^0.8.4
  app_links: ^7.2.1
  device_info_plus: ^13.2.0
  saf_util: ^3.1.0
  screen_brightness: ^2.1.11
  flutter_volume_controller: ^2.0.2
  fvp: ^0.38.1
  video_player: ^2.14.0
  wakelock_plus: ^1.8.0
  popover: ^0.4.0
  pure_ftp: ^0.7.5
  drives_windows:
    git:
      url: https://github.com/nini22P/drives_windows
      ref: main
  media_stream:
    git:
      url: https://github.com/nini22P/media_stream
      ref: main

dependency_overrides:
  # pure_ftp 0.7.5 已不再维护且无法在 Dart >= 3.10 下编译,
  # 使用 third_party/pure_ftp 里打过补丁的内嵌版本 (见该目录 PATCHES.md)。
  pure_ftp:
    path: third_party/pure_ftp
  # fvp 0.38.1 存在 Windows 崩溃 bug (#397/#401), 官方修复尚未发版,
  # 使用 third_party/fvp 内嵌的修复版 (见该目录 PATCHES.md); 上游发版后可移除本项。
  fvp:
    path: third_party/fvp

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_pubspec_licenses: ^3.0.12
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.11.1
  msix: ^3.18.0
  # flutter_hooks_lint: ^1.4.0
  # custom_lint: ^0.8.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/

msix_config:
  display_name: IRIS player
  identity_name: 22P.IRISplayer
  publisher_display_name: 22P
  publisher: CN=9740B6B2-E777-4F52-8ECD-C4A577A73010
  msix_version: 2.0.1.0
  logo_path: assets/images/logo.png
  trim_logo: false
  languages: en-us, zh-cn
  execution_alias: iris
  file_extension: .aac, .aiff, .alac, .amr, .ape, .caf, .cda, .dsd, .dts, .flac, .m4a, .midi, .mp3, .mpc, .oga, .ogg, .opus, .raw, .spx, .tak, .tta, .wav, .wma, .wv, .3gp, .amv, .asf, .avi, .divx, .dpx, .drc, .dv, .f4v, .flv, .h264, .h265, .hevc, .m2ts, .m4p, .m4v, .mkv, .mng, .mov, .mp2, .mp4, .mpe, .mpeg, .mpg, .mpv, .mts, .mxf, .nsv, .ogv, .qt, .rm, .rmvb, .ts, .vob, .webm, .wmv, .yuv