name: ci
on:
  push:
    branches: [main, dev, 'fix/**']
    paths-ignore: [README.md, README_EN.md, LICENSE]
  pull_request:
    paths-ignore: [README.md, README_EN.md, LICENSE]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Provide legacy Flutter version file
        run: echo '3.47.5' > "$FLUTTER_ROOT/version"
      - name: Generate code
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --no-pub
      - name: Test CI signing helpers
        run: python -m unittest discover -s test -p '*_test.py'
      - name: Check updater PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/windows/iris-updater.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }

  build-windows:
    needs: analyze-and-test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Provide legacy Flutter version file
        shell: pwsh
        run: Set-Content -LiteralPath "$env:FLUTTER_ROOT/version" -Value '3.47.5'
      - name: Generate code
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
      - name: Test portable updater transactions
        shell: pwsh
        run: ./test/updater_test.ps1
      - name: Build Flutter application for Windows
        run: flutter build windows
      - name: Create ZIP archive
        run: |
          New-Item -ItemType Directory IRIS | Out-Null
          Copy-Item 'build/windows/x64/runner/Release/*' IRIS -Recurse
          Compress-Archive IRIS IRIS-windows.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IRIS-windows.zip
          path: IRIS-windows.zip
      - name: Remove portable updater
        run: Remove-Item build/windows/x64/runner/Release/iris-updater.bat,build/windows/x64/runner/Release/iris-updater.ps1
      - name: Create installer
        run: iscc inno.iss
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IRIS-windows-installer.exe
          path: build/windows/x64/runner/Release/IRIS-windows-installer.exe
      - name: Build store MSIX
        run: |
          Remove-Item build/windows/x64/runner/Release/IRIS-windows-installer.exe
          dart run msix:build --store true
      - name: Remove portable updater from MSIX
        run: Remove-Item build/windows/x64/runner/Release/iris-updater.bat,build/windows/x64/runner/Release/iris-updater.ps1
      - name: Pack store MSIX
        run: dart run msix:pack --store true --output-name IRIS-windows-store
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IRIS-windows-store.msix
          path: build/windows/x64/runner/Release/IRIS-windows-store.msix

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - name: Provide legacy Flutter version file
        run: echo '3.47.5' > "$FLUTTER_ROOT/version"
      - name: Generate code
        run: |
          flutter pub get --enforce-lockfile
          dart run build_runner build
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: zulu
          java-version: 21
      - name: Build PR validation APK without release secrets
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --target-platform android-arm64
      - name: Prepare release signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: python .github/scripts/prepare_signing.py
      - name: Build signed release APKs
        if: github.event_name != 'pull_request'
        run: |
          flutter build apk --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk IRIS-android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk IRIS-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk IRIS-android-x86_64.apk
      - name: Upload APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IRIS-android
          path: IRIS-android-*.apk
      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks android/key.properties

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Resolve version and verify existing tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: python .github/scripts/release_metadata.py
      - name: Extract changelog
        if: steps.version.outputs.exists == 'false'
        env:
          TAG_NAME: ${{ steps.version.outputs.tag }}
        run: python extract_log.py "$TAG_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.version.outputs.exists == 'false'
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release for the exact build commit
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.version.outputs.tag }}
          body_path: CHANGELOG_${{ steps.version.outputs.tag }}.md
          draft: false
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/IRIS-windows.zip
            artifacts/IRIS-windows-installer.exe
            artifacts/IRIS-android-armeabi-v7a.apk
            artifacts/IRIS-android-arm64-v8a.apk
            artifacts/IRIS-android-x86_64.apk
